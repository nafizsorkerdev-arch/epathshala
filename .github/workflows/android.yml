name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Patch theme for system bars
        run: |
          python3 - <<'EOF'
          p='www/index.html'
          s=open(p,encoding='utf-8').read()
          old='sw.setAttribute("aria-checked",d==="dark")}'
          new='sw.setAttribute("aria-checked",d==="dark");try{var C=window.Capacitor;if(C){window.__sb=window.__sb||(C.Plugins&&C.Plugins.SystemBars)||C.registerPlugin("SystemBars");window.__sb.setStyle({style:d==="dark"?"DARK":"LIGHT"}).catch(function(){})}}catch(e){}}'
          assert s.count(old)==1
          open(p,'w',encoding='utf-8').write(s.replace(old,new))
          EOF

      - name: Add Android platform
        run: npx cap add android

      - name: Sync
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: epathshala-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
